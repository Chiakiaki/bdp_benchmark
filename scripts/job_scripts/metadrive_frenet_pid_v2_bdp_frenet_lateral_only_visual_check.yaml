# Visual-check a route-continuous Frenet-PID-v2 BDP checkpoint with the
# lateral-only steering error and persistent steering integral. Supply a
# checkpoint trained with the same sampler through --model_path.
runtime:
  run_mode: evaluate
  run_name: metadrive_frenet_pid_v2_bdp_frenet_lateral_only_visual_check
  visual_check: true
  inference_mode: deterministic
environment:
  simulator: metadrive
  env_id: MetaDrive-v0
  trajectory_execution_mode: frenet_pid_v2
  environment_config:
    use_render: true
    out_of_route_done: true
    on_continuous_line_done: false
    vehicle_config:
      lidar:
        num_others: 4
    agent_configs:
      default_agent:
        use_special_color: true
        spawn_lane_index: [">", ">>", 0]
        max_speed_km_h: 80.0
    map: 3
    traffic_density: 0.1
    random_traffic: false
    num_scenarios: 1000
    start_seed: 5000
    store_map: false
    horizon: 1000
    physics_world_step_size: 0.02
    decision_repeat: 5
    log_level: 50
frenet:
  trajectory_horizon_s: 2.0
  trajectory_sample_count: 11
  position_feature_scale_m: 50.0
  speed_feature_scale_mps: 40.0
  frenet_speed_delta_mps: 5.0
  maximum_target_speed_mps: 22.222222
pid:
  pid_lookahead_points: 2
  pid_steering_error_mode: lateral_only
  pid_integral_reset_on_reference_change: false
  pid_heading_kp: 1.2
  pid_heading_ki: 0.0
  pid_heading_kd: 0.08
  pid_cross_track_kp: 0.35
  pid_speed_kp: 1.0
  pid_speed_ki: 0.05
  pid_speed_kd: 0.0
  pid_max_steering_rad: 0.7
  pid_max_accel_mps2: 5.0
  pid_max_decel_mps2: 8.0
algorithm:
  name: PPO
  n_envs: 1
  vec_env: dummy
  seed: 41
  device: auto
model_architecture:
  policy_mode: bdp
  builtin_policy: MlpPolicy
  candidate_sampler: frenet_route_continuous
  candidate_scorer: dot
  policy_layers: [256, 256]
  value_layers: [256, 256]
evaluation:
  evaluate_episodes: 3
  model_path: null
logging:
  monitor_mode: none
