# DQN builtin comparison. Source: ../benchmark_metadrive_12mps/metadrive_native_builtin_benchmark.yaml
# Simulator, observation, reward, controller and shared training settings are unchanged.
# batch_size is replay minibatch size; policy_layers defines the Q-network.
# Replay capacity is 1M transitions total, approximately 2.2 GB for 275D observations.
runtime:
  run_mode: train
  run_name: metadrive_native_dqn_builtin_12mps_benchmark
environment:
  simulator: metadrive
  env_id: MetaDrive-v0
  trajectory_execution_mode: native_controller
  environment_config:
    use_render: false
    out_of_route_done: true
    on_continuous_line_done: false
    vehicle_config:
      lidar:
        num_others: 4
    agent_configs:
      default_agent:
        use_special_color: true
        spawn_lane_index:
        - '>'
        - '>>'
        - 0
        max_speed_km_h: 43.2
    map: 3
    traffic_density: 0.1
    random_traffic: false
    num_scenarios: 1000
    start_seed: 5000
    store_map: false
    horizon: 1000
    physics_world_step_size: 0.02
    decision_repeat: 5
    log_level: 50
algorithm:
  name: DQN
  num_timesteps: 2000000
  learning_rate: 5.0e-05
  schedule: fixed
  batch_size: 100
  gamma: 0.99
  n_envs: 8
  vec_env: subproc
  seed: 41
  device: auto
  max_grad_norm: 0.5
  dqn_buffer_size: 1000000
  dqn_learning_starts: 100
  dqn_tau: 1.0
  dqn_train_freq: 4
  dqn_gradient_steps: 1
  dqn_target_update_interval: 10000
  dqn_exploration_fraction: 0.1
  dqn_exploration_initial_eps: 1.0
  dqn_exploration_final_eps: 0.05
model_architecture:
  policy_mode: builtin
  builtin_policy: MlpPolicy
  policy_layers:
  - 256
  - 256
logging:
  log_path: logs/benchmark
  log_interval: 1
  save_freq: 200000
  eval_freq: 0
  monitor_mode: env
