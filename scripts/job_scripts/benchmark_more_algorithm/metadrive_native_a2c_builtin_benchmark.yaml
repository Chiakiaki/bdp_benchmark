# A2C builtin comparison. Source: ../benchmark/metadrive_native_builtin_benchmark.yaml
# Simulator, observation, reward, controller and shared training settings are unchanged.
# One A2C update per 8000-transition rollout; no minibatches or repeated epochs.
runtime:
  run_mode: train
  run_name: metadrive_native_a2c_builtin_benchmark
environment:
  simulator: metadrive
  env_id: MetaDrive-v0
  trajectory_execution_mode: native_controller
  environment_config:
    use_render: false
    out_of_route_done: true
    on_continuous_line_done: false
    vehicle_config:
      lidar:
        num_others: 4
    agent_configs:
      default_agent:
        use_special_color: true
        spawn_lane_index:
        - '>'
        - '>>'
        - 0
        max_speed_km_h: 80.0
    map: 3
    traffic_density: 0.1
    random_traffic: false
    num_scenarios: 1000
    start_seed: 5000
    store_map: false
    horizon: 1000
    physics_world_step_size: 0.02
    decision_repeat: 5
    log_level: 50
algorithm:
  name: A2C
  num_timesteps: 2000000
  learning_rate: 5.0e-05
  schedule: fixed
  trpo_timesteps_per_batch: 1000
  gamma: 0.99
  gae_lambda: 0.95
  n_envs: 8
  vec_env: subproc
  seed: 41
  device: auto
  ent_coef: 0.0
  value_loss_coef: 0.5
  max_grad_norm: 0.5
  a2c_use_rms_prop: true
  a2c_rms_prop_eps: 1.0e-05
  a2c_normalize_advantage: false
model_architecture:
  policy_mode: builtin
  builtin_policy: MlpPolicy
  policy_layers:
  - 256
  - 256
  value_layers:
  - 256
  - 256
logging:
  log_path: logs/benchmark
  log_interval: 1
  save_freq: 200000
  eval_freq: 0
  monitor_mode: env
