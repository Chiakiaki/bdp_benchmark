# One-hot candidate ablation for the mixed-road 10 Hz BDP-Frenet benchmark.
# It preserves the same native HighwayEnv actions and all training settings.
runtime:
  run_mode: train
  run_name: highway_mixed_native_bdp_one_hot_10hz_benchmark
environment:
  simulator: highway
  environment_variants:
    - highway-fast-v0
    - merge-v1
    - roundabout-v1
  trajectory_execution_mode: native_controller
  environment_config:
    simulation_frequency: 20 # Internal vehicle/traffic simulation rate in Hz; 2 physics steps per policy action.
    policy_frequency: 10 # Policy inference rate in Hz; each env.step advances 0.1 simulated seconds.
    observation:
      type: Kinematics
      vehicles_count: 5
      features: [presence, x, y, vx, vy]
      normalize: true
      absolute: false
      order: sorted
frenet:
  trajectory_horizon_s: 2.0
  trajectory_sample_count: 11
  position_feature_scale_m: 50.0
  speed_feature_scale_mps: 40.0
algorithm:
  name: PPO
  num_timesteps: 10000000 # 5x transitions; at 10 Hz this covers half the original aggregate simulated time.
  learning_rate: 5.0e-4
  schedule: fixed
  trpo_timesteps_per_batch: 128
  batch_size: 64
  ppo_epochs: 10
  gamma: 0.98 # Approximate 10 Hz equivalent of gamma=0.80 at 1 Hz.
  gae_lambda: 0.95
  target_kl: null
  n_envs: 12
  vec_env: subproc
  seed: 41
  device: auto
model_architecture:
  policy_mode: bdp
  builtin_policy: MlpPolicy
  candidate_sampler: one_hot
  candidate_scorer: dot
  policy_layers: [256, 256]
  value_layers: [256, 256]
logging:
  log_path: logs/benchmark
  log_interval: 10
  save_freq: 200000
  eval_freq: 0
  monitor_mode: env

