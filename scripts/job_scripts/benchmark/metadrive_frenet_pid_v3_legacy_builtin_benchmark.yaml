# V3 legacy MetaDrive categorical PPO benchmark selecting the same 25
# distance-retimed candidates as its BDP-Frenet pair, with direct v_target PI.
runtime:
  run_mode: train
  run_name: metadrive_frenet_pid_v3_legacy_builtin_adaptive_pursuit_benchmark
environment:
  simulator: metadrive
  env_id: MetaDrive-v0
  trajectory_execution_mode: frenet_pid_v3_legacy
  environment_config:
    use_render: false
    out_of_route_done: true
    on_continuous_line_done: false
    vehicle_config:
      lidar:
        num_others: 4
    agent_configs:
      default_agent:
        use_special_color: true
        spawn_lane_index: [">", ">>", 0]
        max_speed_km_h: 80.0
    map: 3
    traffic_density: 0.1
    random_traffic: false
    num_scenarios: 1000
    start_seed: 5000
    store_map: false
    horizon: 1000
    physics_world_step_size: 0.02
    decision_repeat: 5
    log_level: 50
frenet:
  trajectory_horizon_s: 2.0
  trajectory_sample_count: 11
  position_feature_scale_m: 50.0
  speed_feature_scale_mps: 40.0
  frenet_speed_command_time_s: 1.0
  frenet_speed_delta_rate_mps2: 8.0
  frenet_speed_action_scales: [-1, -0.5, 0, 0.5, 1]
  maximum_target_speed_mps: 22.222222
  frenet_include_curvature_candidates: true # 15 lane targets plus 10 left/right circular candidates.
  frenet_curvature_steering_fraction: 0.9 # Fraction of min(vehicle, PID) steering limit; not a grip guarantee.
pid:
  pid_controller_mode: adaptive_pursuit # Rear-axle pure pursuit plus persistent speed PI.
  pid_lookahead_time_s: 0.7 # Lookahead grows with actual vehicle speed.
  pid_min_lookahead_m: 3.0
  pid_max_lookahead_m: 12.0
  pid_pursuit_gain: 1.0
  pid_speed_preview_s: 0.4 # Ignored in v3_legacy; PI uses cached v_target directly.
  pid_lookahead_points: 2
  pid_steering_error_mode: lateral_only
  pid_integral_reset_on_reference_change: false
  pid_heading_kp: 1.2
  pid_heading_ki: 0.0
  pid_heading_kd: 0.08
  pid_cross_track_kp: 0.35
  pid_speed_kp: 2.0
  pid_speed_ki: 0.2
  pid_speed_kd: 0.0
  pid_max_steering_rad: 0.7
  pid_max_accel_mps2: 5.0
  pid_max_decel_mps2: 8.0
algorithm:
  name: PPO
  num_timesteps: 2000000
  learning_rate: 5.0e-5
  schedule: fixed
  trpo_timesteps_per_batch: 1000
  batch_size: 100
  ppo_epochs: 20
  gamma: 0.99
  gae_lambda: 0.95
  ppo_clip_range: 0.2
  target_kl: null
  n_envs: 8
  vec_env: subproc
  seed: 41
  device: auto
model_architecture:
  policy_mode: builtin
  builtin_policy: MlpPolicy
  candidate_sampler: frenet_route_continuous
  policy_layers: [256, 256]
  value_layers: [256, 256]
logging:
  tracking_diagnostics: true # Rollout means only; no per-step sample retention.
  log_path: logs/benchmark
  log_interval: 1
  save_freq: 200000
  eval_freq: 0
  monitor_mode: env
