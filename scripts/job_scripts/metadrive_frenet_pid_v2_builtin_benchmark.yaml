# Nominal-origin MetaDrive categorical PPO benchmark selecting the same 15
# lane-center by target-speed Frenet trajectories as frenet_pid.
runtime:
  run_mode: train
  run_name: metadrive_frenet_pid_v2_builtin_benchmark
environment:
  simulator: metadrive
  env_id: MetaDrive-v0
  trajectory_execution_mode: frenet_pid_v2
  environment_config:
    use_render: false
    map: 3
    traffic_density: 0.1
    random_traffic: false
    num_scenarios: 1000
    start_seed: 5000
    horizon: 1000
    physics_world_step_size: 0.02
    decision_repeat: 5
    log_level: 50
frenet:
  trajectory_horizon_s: 2.0
  trajectory_sample_count: 11
  position_feature_scale_m: 50.0
  speed_feature_scale_mps: 40.0
  frenet_speed_delta_mps: 5.0
algorithm:
  name: PPO
  num_timesteps: 2000000
  learning_rate: 3.0e-4
  schedule: fixed
  trpo_timesteps_per_batch: 4000
  batch_size: 1000
  ppo_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  target_kl: null
  n_envs: 8
  vec_env: subproc
  seed: 41
  device: auto
model_architecture:
  policy_mode: builtin
  builtin_policy: MlpPolicy
  policy_layers: [256, 256]
  value_layers: [256, 256]
logging:
  log_path: logs/benchmark
  log_interval: 10
  save_freq: 200000
  eval_freq: 0
  monitor_mode: env
