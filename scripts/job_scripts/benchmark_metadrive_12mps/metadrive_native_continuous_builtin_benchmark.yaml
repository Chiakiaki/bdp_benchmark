# Native MetaDrive 12 m/s continuous-control PPO reference.
# MetaDrive's paper PPO baseline uses an 8000-sample train batch, minibatch 100,
# 20 epochs, lr=5e-5, gamma=0.99, lambda=0.95, and clip=0.2. Eight workers keep
# that aggregate batch on this host via 1000 steps per environment.
runtime:
  run_mode: train
  run_name: metadrive_native_continuous_builtin_12mps_benchmark
environment:
  simulator: metadrive
  env_id: MetaDrive-v0
  trajectory_execution_mode: native_controller
  environment_config:
    use_render: false
    discrete_action: false
    out_of_route_done: true
    on_continuous_line_done: false
    vehicle_config:
      lidar:
        num_others: 4
    agent_configs:
      default_agent:
        use_special_color: true
        spawn_lane_index: [">", ">>", 0]
        max_speed_km_h: 43.2
    map: 3
    traffic_density: 0.1
    random_traffic: false
    num_scenarios: 1000
    start_seed: 5000
    store_map: false
    horizon: 1000
    physics_world_step_size: 0.02
    decision_repeat: 5
    log_level: 50
algorithm:
  name: PPO
  num_timesteps: 2000000
  learning_rate: 5.0e-5
  schedule: fixed
  trpo_timesteps_per_batch: 1000
  batch_size: 100
  ppo_epochs: 20
  gamma: 0.99
  gae_lambda: 0.95
  ppo_clip_range: 0.2
  target_kl: null
  n_envs: 8
  vec_env: subproc
  seed: 41
  device: auto
model_architecture:
  policy_mode: builtin
  builtin_policy: MlpPolicy
  policy_layers: [256, 256]
  value_layers: [256, 256]
logging:
  log_path: logs/benchmark
  log_interval: 1
  save_freq: 200000
  eval_freq: 0
  monitor_mode: env
