[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bdp-benchmark"
version = "0.1.0"
description = "Candidate-action benchmarks for HighwayEnv and MetaDrive"
requires-python = ">=3.10"
dependencies = [
  "gymnasium>=1.2",
  "numpy>=1.23",
  "pyyaml>=6",
  "stable-baselines3>=2.7",
]

[tool.setuptools.packages.find]
include = ["bdp_benchmark*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
